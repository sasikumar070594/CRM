function saveLead(id){if(!v('lname')||!v('lmobile'))return alert('Business Name and Mobile required');let o=id?DB.leads.find(x=>x.id==id):{id:uid('LEAD'),created:new Date().toISOString().slice(0,10)};Object.assign(o,{name:v('lname'),person:v('lperson'),mobile:v('lmobile'),whatsapp:v('lwa'),email:v('lemail'),category:v('lcat'),address:v('laddr'),city:v('lcity'),source:v('lsource'),service:v('lservice'),budget:Number(v('lbudget')||0),followup:v('lfollow'),notes:v('lnotes'),status:v('lstatus')});if(!id)DB.leads.unshift(o);closeModal();save();if(o.followup&&!id)DB.followups.unshift({id:uid('FU'),who:o.name,type:'Lead',date:o.followup,note:'Follow-up: '+o.service,status:'Pending'})}
function saveClient(id){if(!v('cname')||!v('cmobile'))return alert('Client Name and Mobile required');let o=id?DB.clients.find(x=>x.id==id):{id:uid('CL'),created:new Date().toISOString().slice(0,10)};Object.assign(o,{name:v('cname'),person:v('cperson'),mobile:v('cmobile'),alt:v('calt'),whatsapp:v('cwa'),email:v('cemail'),address:v('caddr'),city:v('ccity'),gst:v('cgst'),website:v('cweb'),gbp:v('cgbp'),notes:v('cnotes')});if(!id)DB.clients.unshift(o);closeModal();save()}

function saveProject(id){if(!v('pclient')||!v('ptitle'))return alert('Client and Title required');let o=id?DB.projects.find(x=>x.id==id):{id:uid('PRJ'),created:new Date().toISOString().slice(0,10)};Object.assign(o,{client:v('pclient'),service:v('pservice'),title:v('ptitle'),desc:v('pdesc'),start:v('pstart'),due:v('pdue'),price:Number(v('pprice')||0),advance:Number(v('padv')||0),received:Number(v('prec')||0),person:v('pperson'),priority:v('ppri'),status:v('pstatus')});o.balance=o.price-o.received;if(!id)DB.projects.unshift(o);closeModal();save()}
function saveInvoice(id){if(!v('iclient'))return alert('Client required');let sub=Number(v('iqty')||1)*Number(v('iprice')||0);let disc=Number(v('idisc')||0);let gstAmt=(sub-disc)*Number(v('igst')||0)/100;let total=sub-disc+gstAmt;let o=id?DB.invoices.find(x=>x.id==id):{id:uid('INV'),num:(DB.settings.prefix||'SKDA')+'-'+String(DB.invoices.length+1).padStart(4,'0'),date:new Date().toISOString().slice(0,10)};var _terms=v('iterms');var _termsId=v('itermsSel');if(!_terms){var _tpl=(DB.termsTemplates||[]).find(function(x){return x.id==_termsId})||(DB.termsTemplates||[]).find(function(x){return x.service&&v('iservice')&&x.service.toLowerCase().indexOf(v('iservice').toLowerCase().slice(0,4))>-1})||(DB.termsTemplates||[])[0];if(_tpl){_terms=_tpl.text;_termsId=_tpl.id}}Object.assign(o,{client:v('iclient'),service:v('iservice'),qty:Number(v('iqty')||1),price:Number(v('iprice')||0),discount:disc,gst:Number(v('igst')||0),gstAmt,subtotal:sub,total,advance:Number(v('iadv')||0),due:v('idue'),notes:v('inotes'),terms:_terms,termsId:_termsId});o.balance=o.total-o.advance;o.status=o.balance<=0?'Paid':o.advance>0?'Partially Paid':'Unpaid';if(!id)DB.invoices.unshift(o);closeModal();save();go('Invoices');alert('Invoice '+o.num+' saved! Invoice table-la add aayiduchu. View / PNG / PDF / WhatsApp pannalam.')}
function savePayment(id){if(!v('payclient')||!v('payamt'))return alert('Client and Amount required');let o=id?DB.payments.find(x=>x.id==id):{id:uid('PAY')};Object.assign(o,{client:v('payclient'),project:v('payproj'),invoice:v('payinv'),amount:Number(v('payamt')||0),method:v('paymethod'),ref:v('payref'),date:v('paydate'),notes:v('paynotes')});if(!id)DB.payments.unshift(o);closeModal();save()}
function saveExpense(id){let o=id?DB.expenses.find(x=>x.id==id):{id:uid('EXP')};Object.assign(o,{category:v('ecat'),desc:v('edesc'),amount:Number(v('eamt')||0),date:v('edate'),method:v('emethod'),client:v('eclient')});if(!id)DB.expenses.unshift(o);closeModal();save()}

function openPrintWindow(html,title){try{var w=window.open('','_blank','width=900,height=700');if(!w){alert('Popup blocked. Please allow popup for this site.');return}w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+(title||'Invoice')+'</title><style>body{font-family:Arial,sans-serif;margin:0;padding:10px}table{width:100%;border-collapse:collapse}th,td{padding:8px}</style></head><body>'+html+'<script>setTimeout(function(){window.print()},400)<\/script></body></html>');w.document.close()}catch(e){alert('Print open aagalai: '+e.message)}}
function invoiceAction(id,action){try{if(action=='view'){printInvoice(id);return}if(action=='png'||action=='jpeg'){printInvoice(id);setTimeout(function(){downloadInvoice(id,action)},600);return}if(action=='pdf'){var inv=null;for(var i=0;i<DB.invoices.length;i++){if(DB.invoices[i].id==id)inv=DB.invoices[i]}if(!inv){alert('Invoice not found');return}openPrintWindow(invoiceHTML(inv),'Invoice '+inv.num);return}if(action=='wa'){sendInvoiceWA(id);return}if(action=='email'){sendInvoiceEmail(id);return}}catch(e){alert('Invoice button error: '+e.message)}}
function paymentReceiptHTML(p){var s=DB.settings||{};var html='';html+='<div id="receiptSheet" style="background:#fff;color:#111;font-family:Arial,sans-serif;padding:26px;max-width:650px;margin:auto;border:1px solid #ddd">';html+='<div style="display:flex;justify-content:space-between;border-bottom:3px solid '+(s.invColor||'#0A162E')+';padding-bottom:12px"><div><h2 style="margin:0">'+esc(s.name||'SK Digital Ads')+'</h2><p style="margin:4px 0;font-size:13px">'+esc(s.address||'')+'<br>'+esc(s.website||'')+' | '+esc(s.whatsapp||s.phone||'')+'</p></div><div style="text-align:right"><div style="background:'+(s.invColor||'#0A162E')+';color:#fff;padding:8px 14px;border-radius:6px;font-weight:900">PAYMENT RECEIPT</div><p style="font-size:13px">Receipt: '+p.id+'<br>Date: '+dstr(p.date)+'</p></div></div>';html+='<p style="font-size:14px;line-height:1.8;margin-top:16px">Received from <b>'+esc(p.client)+'</b><br>Project / Invoice: '+esc(p.project||'')+' '+(p.invoice?(' / '+esc(p.invoice)):'')+'<br>Method: '+esc(p.method)+' | Ref: '+esc(p.ref||'-')+'<br>Note: '+esc(p.notes||'-')+'</p>';html+='<p style="font-size:20px">Amount Received: <b>'+fmt(p.amount)+'</b></p>';html+='<div style="margin-top:20px;border:1px solid #E2E8F0;border-radius:8px;padding:10px;font-size:12.5px"><b>Terms:</b> Payment received as per invoice terms. Thank you for your business.</div>';html+='<div style="display:flex;justify-content:space-between;margin-top:28px"><p style="font-size:12px;color:#64748B">Computer generated receipt.</p><p style="font-size:12px;border-top:1px solid #111;padding-top:4px"><b>For '+esc(s.name||'SK Digital Ads')+'</b><br>Authorised Signature</p></div></div>';return html}
function showPaymentReceipt(pid){try{var p=null;for(var i=0;i<DB.payments.length;i++){if(DB.payments[i].id==pid)p=DB.payments[i]}if(!p){alert('Payment not found');return}viewRec('Payment Receipt '+p.id,'<div class="flex" style="margin-bottom:12px"><button class="btn" onclick="openPrintWindow(paymentReceiptHTML(DB.payments.find(function(x){return x.id==\''+p.id+'\'})),\'Receipt '+p.id+'\')">Print / PDF - Receipt Only</button><button class="btn gold" onclick="downloadReceiptPNG(\''+p.id+'\')">Download PNG</button></div>'+paymentReceiptHTML(p))}catch(e){alert('Receipt error: '+e.message)}}
function downloadReceiptPNG(pid){var p=null;for(var i=0;i<DB.payments.length;i++){if(DB.payments[i].id==pid)p=DB.payments[i]}if(!p)return;var el=document.getElementById('receiptSheet');if(!el){showPaymentReceipt(pid);setTimeout(function(){downloadReceiptPNG(pid)},500);return}if(typeof html2canvas==='undefined'){alert('Internet on pannitu try pannunga');return}html2canvas(el,{scale:2,backgroundColor:'#ffffff'}).then(function(c){var a=document.createElement('a');a.download=p.id+'-receipt.png';a.href=c.toDataURL('image/png');a.click()})}
function downloadInvoice(id,fmtType){var inv=null;for(var i=0;i<DB.invoices.length;i++){if(DB.invoices[i].id==id)inv=DB.invoices[i]}if(!inv)return;var el=document.getElementById('invoiceSheet');if(!el){printInvoice(id);setTimeout(function(){downloadInvoice(id,fmtType)},300);return}if(typeof html2canvas==='undefined'){alert('Image library load aagalai. Internet on pannitu try pannunga, illa PDF / Print use pannunga.');window.print();return}html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true}).then(function(canvas){var a=document.createElement('a');a.download=inv.num+'-invoice.'+(fmtType=='jpeg'?'jpg':'png');a.href=canvas.toDataURL(fmtType=='jpeg'?'image/jpeg':'image/png',0.95);a.click()}).catch(function(){alert('Download fail aachu. PDF / Print try pannunga.');window.print()})}
function sendInvoiceWA(id){var inv=null;for(var i=0;i<DB.invoices.length;i++){if(DB.invoices[i].id==id)inv=DB.invoices[i]}if(!inv)return;var cl={};for(var j=0;j<DB.clients.length;j++){if(DB.clients[j].name==inv.client)cl=DB.clients[j]}var msg='Hi '+(cl.person||inv.client)+',\n\nYour invoice '+inv.num+' from SK Digital Ads is ready.\n\nService: '+inv.service+'\nTotal: '+fmt(inv.total)+'\nAdvance: '+fmt(inv.advance)+'\nBalance Due: '+fmt(inv.balance)+'\nDue Date: '+dstr(inv.due)+'\n\nTerms & Conditions apply as per invoice.\nThank you!';if(confirm('Invoice PNG-a download panni WhatsApp-la attach panna virumbureengala? OK = PNG download + WhatsApp open aagum. Cancel = WhatsApp mattum open aagum.')){downloadInvoice(id,'png')}wa(cl.whatsapp||cl.mobile||'',msg)}
function sendInvoiceEmail(id){var inv=null;for(var i=0;i<DB.invoices.length;i++){if(DB.invoices[i].id==id)inv=DB.invoices[i]}if(!inv)return;var cl={};for(var j=0;j<DB.clients.length;j++){if(DB.clients[j].name==inv.client)cl=DB.clients[j]}var subj='Invoice '+inv.num+' - SK Digital Ads - '+fmt(inv.total);var body='Dear '+(cl.person||inv.client)+',%0D%0A%0D%0AYour invoice '+inv.num+' is ready.%0D%0AService: '+encodeURIComponent(inv.service)+'%0D%0ATotal: '+encodeURIComponent(fmt(inv.total))+'%0D%0ABalance Due: '+encodeURIComponent(fmt(inv.balance))+'%0D%0ADue Date: '+dstr(inv.due)+'%0D%0A%0D%0AThanks,%0D%0ASK Digital Ads';if(confirm('Email-la invoice attach panna, munnadi PNG download pannidalaama? OK = PNG download + Email open aagum.')){downloadInvoice(id,'png')}window.location.href='mailto:'+(cl.email||'')+'?subject='+encodeURIComponent(subj)+'&body='+body}
function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='sk-digital-ads-crm-backup.json';a.click()}
function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();alert('✅ Backup restored')}catch{alert('Invalid JSON')}};r.readAsText(f)}
function exportCSV(coll){let rows=DB[coll];if(!rows.length)return alert('No data');let keys=Object.keys(rows[0]);let csv=keys.join(',')+'\n'+rows.map(r=>keys.map(k=>'"'+String(r[k]||'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=coll+'.csv';a.click()}
function calc(){let rev=DB.projects.reduce((a,p)=>a+(p.price||0),0);let recv=DB.payments.reduce((a,p)=>a+(p.amount||0),0)+DB.invoices.reduce((a,i)=>a+(i.advance||0),0);let exp=DB.expenses.reduce((a,e)=>a+(e.amount||0),0);return{rev,recv,pending:Math.max(0,rev-recv),exp,profit:rev-exp,invTotal:DB.invoices.reduce((a,i)=>a+(i.total||0),0)}}
function chartBars(data){let max=Math.max(...data.map(d=>d.v),1);return `<div class="bar">${data.map(d=>`<div style="height:${Math.max(6,d.v/max*100)}%"><span>${d.v>0?fmt(d.v).replace('₹ ','₹'):''}</span></div>`).join('')}</div><div class="flex" style="justify-content:space-between">${data.map(d=>`<small style="flex:1;text-align:center">${d.l}</small>`).join('')}</div>`}
function table(head,rows,emptyMsg){if(!rows.length)return `<div class="empty">✨ ${emptyMsg||'No records yet. Click + Add to create one.'}</div>`;return `<div style="overflow:auto"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.join('')}</table></div>`}
function toolsRow(page){return `<div class="toolrow"><button class="tool" onclick="openModal('quick')">⚡ Quick Add</button><button class="tool" onclick="exportJSON()">⬇ Backup JSON</button><button class="tool" onclick="exportCSV('${page}')">📄 Export CSV</button><button class="tool" onclick="go('Settings')">⚙️ Page Settings</button><button class="tool" onclick="toggleDark()">🌙 Dark / Light</button><button class="tool" onclick="window.print()">🖨 Print Page</button></div>`}
